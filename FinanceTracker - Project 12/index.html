<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Comfortaa:wght@300..700&family=Doto:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Macondo&family=MedievalSharp&family=Orbitron:wght@400..900&family=Press+Start+2P&family=Roboto:ital,wght@0,100..900;1,100..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <h1 class="header">Expense Tracker</h1>
    <form class = 'expenseForm' id="form">
        <input type="text" id="expenseName" maxlength="40" name="expenseName" class="formInput" placeholder="Expense Name" required>
        <input type="number" id="amount" step="0.01" min="0.01" name="amount" placeholder="Amount (USD)" class="formInput" required>
        <select name="expenseCategory" id="expenseCategory" class="formInput" placeholder="Select Category" required>
            <option value="" hidden disabled selected class="formInput">Select Category</option>
            <option value="Food" class="formInput">Food</option>
            <option value="Housing" class="formInput">Housing</option>
            <option value="Transport" class="formInput">Transport</option>
            <option value="Health" class="formInput">Health</option>
            <option value="Entertainment" class="formInput">Entertainment</option>
            <option value="Education" class="formInput">Education</option>
        </select>
        <input type="date" id="date" name="date" class="formInput" required>
        <button type="submit" id="submit" class="submit" name="submit">Add Expense</button>
    </form>

    <table class="domTable" id="table">
        <thead>
            <tr class="tr">
                <th class="th">Expense Name</th>
                <th class="th">Amount</th>
                <th class="th">Category</th>
                <th class="th">Date</th>
                <th class="th">Action</th>
            </tr>
        </thead>
        <tbody id="tbody">
            
        </tbody>
        
    </table>
    

    <div class="stats">
        <label for="filter" class="filterLabel">Filter by Category</label>
        <select name="filter" id="filter">
            <option value="all">All</option>
            <option value="Food">Food</option>
            <option value="Housing">Housing</option>
            <option value="Transport">Transport</option>
            <option value="Health">Health</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Education">Education</option>
        </select>
        <p class="total" id = 'total'>Total: $0</p>
    </div>

    <div id="modal">
        <div id="title">Edit Expense</div>
        <form id="modalForm">
            <input type="text" id="productName" class="input">
            <input type="number" id="quantity" step="0.01" class="input" >
            <select name="category" id="category" class="input">
                <option value="Food">Food</option>
                <option value="Housing">Housing</option>
                <option value="Transport">Transport</option>
                <option value="Health">Health</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
            </select>
            <input type='date' id="editDate" class="input">
        </form>
        <div id="btns">
            <button id="saveBtn">Save Changes</button>
            <button id="cancelBtn">Cancel</button>
        </div>
    </div>

    <div id="overlay"></div>
    


    <script src='index.js'></script>
</body>
</html>
